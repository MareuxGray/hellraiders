# Selene standard library for TestEZ spec files (tests/unit/*.spec.luau). Used as std = "roblox+testez".
---
base: roblox
globals:
  describe:
    args:
      - type: string
      - type: function
  it:
    args:
      - type: string
      - type: function
  itFOCUS:
    args:
      - type: string
      - type: function
  itSKIP:
    args:
      - type: string
      - type: function
  expect:
    args:
      - type: any
  beforeEach:
    args:
      - type: function
  afterEach:
    args:
      - type: function
  beforeAll:
    args:
      - type: function
  afterAll:
    args:
      - type: function
  FOCUS:
    args: []
  SKIP:
    args: []
